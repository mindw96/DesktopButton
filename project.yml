name: OneButton
options:
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  OneButton:
    type: application
    platform: macOS
    sources:
      - path: OneButton
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onebutton.desktop
        PRODUCT_NAME: OneButton
        INFOPLIST_FILE: OneButton/Info.plist
        CODE_SIGN_ENTITLEMENTS: OneButton/OneButton.entitlements
        ENABLE_APP_SANDBOX: YES
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.2.2"
        CURRENT_PROJECT_VERSION: "4"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: OneButton/OneButton.Debug.entitlements
  OneButtonTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: OneButtonTests
    dependencies:
      - target: OneButton
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onebutton.desktop.tests
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
  OneButtonFullscreenFixture:
    type: application
    platform: macOS
    sources:
      - path: Tests/FullscreenFixture
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onebutton.desktop.fullscreen-fixture
        GENERATE_INFOPLIST_FILE: YES
schemes:
  OneButton:
    build:
      targets:
        OneButton: all
        OneButtonFullscreenFixture: [test]
    test:
      gatherCoverageData: true
      targets:
        - OneButtonTests
